<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CivicVote Admin Dashboard — Manage elections, candidates, and monitor results.">
    <title>Admin Dashboard — CivicVote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="admin-dashboard.html" class="navbar-brand">
            <div class="logo-icon">🗳️</div>
            CivicVote
        </a>
        <ul class="navbar-nav">
            <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
            <li><a href="results.html">Results</a></li>
        </ul>
        <div class="navbar-user" id="nav-user"></div>
    </nav>

    <main class="container dashboard">
        <div class="dashboard-header">
            <h1>Admin Dashboard</h1>
            <p>Manage elections, candidates, and monitor results</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total Elections</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="stat-active">0</div>
                <div class="stat-label">Active Elections</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔒</div>
                <div class="stat-value" id="stat-closed">0</div>
                <div class="stat-label">Closed Elections</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👤</div>
                <div class="stat-value" id="stat-candidates">0</div>
                <div class="stat-label">Total Candidates</div>
            </div>
        </div>

        <!-- Elections Section -->
        <div class="section">
            <div class="section-header">
                <h2>Elections</h2>
                <button class="btn btn-primary btn-sm" onclick="openCreateElectionModal()">+ Create Election</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Candidates</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="elections-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Election Modal -->
    <div id="election-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeElectionModal()">
        <div class="modal">
            <div class="modal-header">
                <h2>Create Election</h2>
                <button class="modal-close" onclick="closeElectionModal()">&times;</button>
            </div>
            <form id="create-election-form">
                <div class="form-group">
                    <label for="election-title">Title</label>
                    <input type="text" id="election-title" class="form-control" placeholder="e.g., Student Council Election 2026" required>
                </div>
                <div class="form-group">
                    <label for="election-desc">Description</label>
                    <textarea id="election-desc" class="form-control" placeholder="Describe the election"></textarea>
                </div>
                <div class="form-group">
                    <label for="election-start">Start Date & Time</label>
                    <input type="datetime-local" id="election-start" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="election-end">End Date & Time</label>
                    <input type="datetime-local" id="election-end" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create Election</button>
            </form>
        </div>
    </div>

    <!-- Add Candidate Modal -->
    <div id="candidate-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeCandidateModal()">
        <div class="modal">
            <div class="modal-header">
                <h2>Manage Candidates</h2>
                <button class="modal-close" onclick="closeCandidateModal()">&times;</button>
            </div>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:16px;" id="candidate-election-title"></p>

            <div id="candidates-list" style="margin-bottom:20px;"></div>

            <form id="add-candidate-form">
                <div class="form-group">
                    <label for="candidate-name">Candidate Name</label>
                    <input type="text" id="candidate-name" class="form-control" placeholder="Enter candidate name" required>
                </div>
                <div class="form-group">
                    <label for="candidate-desc">Description</label>
                    <input type="text" id="candidate-desc" class="form-control" placeholder="Brief description (optional)">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Add Candidate</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
