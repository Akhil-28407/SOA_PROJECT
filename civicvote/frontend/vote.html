<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cast your vote in the election on CivicVote">
    <title>Vote — CivicVote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="elections.html" class="navbar-brand">
            <div class="logo-icon">🗳️</div>
            CivicVote
        </a>
        <ul class="navbar-nav">
            <li><a href="elections.html">Elections</a></li>
            <li><a href="results.html">Results</a></li>
        </ul>
        <div class="navbar-user" id="nav-user"></div>
    </nav>

    <main class="container">
        <div class="vote-section" id="vote-container">
            <div style="margin-bottom:24px;">
                <a href="elections.html" style="font-size:0.85rem;color:var(--text-secondary);">← Back to Elections</a>
            </div>

            <h1 id="election-title">Loading...</h1>
            <p id="election-desc" style="color:var(--text-secondary);margin:8px 0;"></p>
            <div style="display:flex;gap:16px;align-items:center;margin:12px 0;">
                <span id="election-status"></span>
                <span id="election-dates" style="font-size:0.8rem;color:var(--text-muted);"></span>
            </div>

            <div class="candidate-list" id="candidate-list">
                <div class="loading"><div class="spinner"></div> Loading candidates...</div>
            </div>

            <button id="vote-btn" class="btn btn-primary btn-full" onclick="submitVote()" disabled>
                Cast Your Vote
            </button>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/voting.js"></script>
</body>
</html>
